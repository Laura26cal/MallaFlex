<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MallaFlex - Error 404</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="layout">
        <aside th:replace="~{fragments :: sidebar('inicio')}"></aside>

        <main class="contenido">
            <div class="card error404">
                <h1>404</h1>
                <h2>Página no encontrada</h2>
                <p>Lo que buscas no existe o fue eliminado.</p>
                <p class="detalle" th:text="${mensaje}">Detalle del error</p>
                <button type="button" onclick="location.href='/'">Volver al inicio</button>
            </div>
        </main>
    </div>
</body>
</html>

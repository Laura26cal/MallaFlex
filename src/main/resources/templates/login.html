<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MallaFlex - Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth">
        <h1 class="logo">Malla<span>Flex</span></h1>
        <div class="card">
            <h3>Iniciar sesión</h3>

            <div class="alerta ok" th:if="${param.registrado != null}">Cuenta creada. Ya puedes iniciar sesión.</div>
            <div class="alerta error" th:if="${error}" th:text="${error}">Error</div>

            <form class="form-columna" th:action="@{/login}" method="post">
                <div class="campo">
                    <label>Correo</label>
                    <input type="email" name="correo" required>
                </div>
                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Entrar</button>
            </form>

            <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MallaFlex - Mallas y materias</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('mallas')}"></aside>

    <main class="contenido">
        <header class="top">
            <div>
                <h2 class="titulo">Mallas y materias</h2>
                <p class="sub">Crea, edita o elimina mallas curriculares y sus materias.</p>
            </div>
            <div class="user">
                <div th:replace="~{fragments :: perfil}"></div>
            </div>
        </header>

        <div class="alerta ok" th:if="${ok}" th:text="${ok}">Hecho</div>
        <div class="alerta error" th:if="${error}" th:text="${error}">Error</div>

        <div class="card barra-herramientas">
            <form class="buscador" method="get" th:action="@{/admin/mallas}">
                <input type="search" name="q" th:value="${q}" placeholder="Buscar malla por código o nombre">
                <button type="submit">Buscar</button>
            </form>
            <a class="btn" th:href="@{/admin/mallas/nueva}">+ Nueva malla</a>
        </div>

        <div class="card tabla">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Código</th><th>Nombre</th><th>Plan</th><th>Créditos</th>
                        <th>Semestres</th><th>Materias</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${carreras}">
                        <td th:text="${c.codigo}">2A74</td>
                        <td th:text="${c.nombre}">Ingeniería de Sistemas</td>
                        <td th:text="${c.plan}">Plan</td>
                        <td th:text="${c.creditosTotales}">165</td>
                        <td th:text="${c.numSemestres}">10</td>
                        <td th:text="${conteo[c.codigo] ?: 0}">45</td>
                        <td>
                            <div class="acciones">
                                <a class="icono" th:href="@{/admin/mallas/{c}(c=${c.codigo})}"
                                   title="Editar malla" aria-label="Editar malla">✏️</a>
                                <form th:action="@{/admin/mallas/{c}/eliminar(c=${c.codigo})}" method="post"
                                      onsubmit="return confirm('¿Eliminar esta malla? Sus materias dejarán de pertenecer a ella (las materias siguen existiendo).');">
                                    <button type="submit" class="icono peligro"
                                            title="Eliminar malla" aria-label="Eliminar malla">🗑️</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(carreras)}">
                        <td colspan="7">No hay mallas que coincidan.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

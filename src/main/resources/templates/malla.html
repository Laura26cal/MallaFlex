<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MallaFlex - Malla curricular</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="layout">

        <aside class="sidebar">
            <h1>Malla<span>Flex</span></h1>

            <nav>
                <a th:href="@{/}">Inicio</a>
                <a th:href="@{/ruta}">Ruta óptima</a>
                <a th:href="@{/malla}" class="activo">Malla curricular</a>
                <a th:href="@{/historia}">Historia académica</a>
            </nav>
            <div class="sesion">
                <p th:if="${usuario != null}" th:text="${usuario.nombre}">Nombre</p>
                <form th:if="${usuario != null}" th:action="@{/logout}" method="post">
                    <button type="submit">Cerrar sesión</button>
                </form>
                <a th:if="${usuario == null}" th:href="@{/login}">Iniciar sesión</a>
            </div>
        </aside>

        <main class="contenido">
            <h2 class="titulo">Malla curricular</h2>
            <p class="sub" th:text="${malla.carrera.nombre}">Ingeniería de Sistemas y Computación.</p>
            <select onchange="location.href='/malla?carrera=' + this.value">
                <option th:each="c : ${carreras}"
                        th:value="${c.codigo}"
                        th:text="${c.codigo + ' - ' + c.nombre}"
                        th:selected="${c.codigo == malla.carrera.codigo}">2A74 - Ingeniería</option>
            </select>


            <div class="card aviso">
                
            </div>
            <div class="leyenda">
                <div class="leyenda-items">
                    <span><i class="cuadro aprobada"></i>Aprobada</span>
                    <span><i class="cuadro encurso"></i>En curso</span>
                    <span><i class="cuadro perdida"></i>Perdida</span>
                    <span><i class="cuadro desbloqueada"></i>Desbloqueada</span>
                    <span><i class="cuadro bloqueada"></i>Bloqueada</span>
                </div>
                <p class="resumen" th:if="${resumen != null}"
                    th:text="${resumen.materiasAprobadas} + ' aprobadas · ' + ${resumen.materiasCursando} + ' en curso · ' + ${resumen.materiasPerdidas} + ' perdidas'">0 aprobadas</p>
            </div>

            <div class="semestres">
                <div class="semestre" th:each="s : ${malla.semestres}">
                    <h3 th:text="${s.semestre == 0 ? 'Sin semestre' : 'Semestre ' + s.semestre}">Semestre 1</h3>

                    <div class="materia" th:each="m : ${s.materias}"
                        th:classappend="${estados[m.codigo] != null ? #strings.toLowerCase(#strings.replace(estados[m.codigo], '_', '')) : ''}">
                        <h4 th:text="${m.nombre}">Materia</h4>
                        <p th:text="${m.creditos} + ' cr.'">3 cr.</p>
                    </div>
                </div>
            </div>


            </div>

        </main>

    </div>

</body>
</html>
